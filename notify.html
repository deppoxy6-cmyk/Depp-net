<!DOCTYPE html><html lang="rn">  <head>  
<meta charset="UTF-8">  
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Depp Net - Notifications</title><style>  
*{  
box-sizing:border-box;  
}  body{
margin:0;
font-family:Arial,sans-serif;
background:#f1f3f6;
color:#222;
}

header{
background:#1877f2;
color:white;
padding:14px 16px;
display:flex;
align-items:center;
justify-content:space-between;
}

.logo{
font-size:23px;
font-weight:bold;
}

.home-btn{
border:none;
background:white;
color:#1877f2;
padding:8px 12px;
border-radius:8px;
font-weight:bold;
}

.container{
max-width:600px;
margin:auto;
padding:15px;
}

.card{
background:white;
border-radius:12px;
padding:16px;
margin-bottom:15px;
box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.title{
text-align:center;
}

.title h2{
margin:0;
}

.count{
text-align:center;
color:#777;
margin-top:8px;
}

.buttons{
display:flex;
gap:8px;
margin-top:15px;
}

.buttons button{
flex:1;
padding:10px;
border:none;
border-radius:8px;
font-weight:bold;
}

.read-btn{
background:#e7f3ff;
color:#1877f2;
}

.clear-btn{
background:#ffe5e5;
color:#d00000;
}

.notification{
padding:13px;
border-radius:10px;
background:#f0f2f5;
margin-top:9px;
cursor:pointer;
}

.notification.unread{
background:#e7f3ff;
border-left:4px solid #1877f2;
}

.notification-main{
display:flex;
gap:10px;
align-items:flex-start;
}

.icon{
font-size:24px;
}

.notification-text{
margin-top:3px;
font-size:15px;
}

.notification-time{
font-size:11px;
color:#777;
margin-top:5px;
}

.empty{
text-align:center;
color:#777;
padding:30px 10px;
}

.error{
text-align:center;
color:#d00000;
padding:25px 10px;
}
</style></head><body><header>

<div class="logo">Depp Net</div><button class="home-btn" onclick="goHome()">  
🏠 Home  
</button>  
</header><div class="container"><div class="card"><div class="title">  
<h2>🔔 Notifications</h2>  
</div><div id="unreadCount" class="count">  
0 notifications nshasha  
</div><div class="buttons"><button class="read-btn" onclick="markAllRead()">  
✓ Soma zose  
</button><button class="clear-btn" onclick="clearNotifications()">  
🗑 Siba zose  
</button></div></div><div id="notificationList"></div></div><script>  /* =========================
HOME
========================= */

function goHome(){
window.location.href="home.html";
}

/* =========================
LOGIN
========================= */

function checkLogin(){

const loggedIn =
localStorage.getItem("deppNetLoggedIn");

if(loggedIn !== "true"){

window.location.href="login.html";

return false;

}

return true;

}

/* =========================
USER
========================= */

function getUser(){

try{

const saved =
localStorage.getItem("deppNetUser");

if(!saved){
return null;
}

const user =
JSON.parse(saved);

if(!user || typeof user !== "object"){
return null;
}

return user;

}catch(error){

console.log("User error:",error);

return null;

}

}

/* =========================
GET NOTIFICATIONS
========================= */

function getNotifications(){

try{

const saved =
localStorage.getItem("deppNetNotifications");

if(!saved){
return [];
}

const data =
JSON.parse(saved);

if(!Array.isArray(data)){
return [];
}

return data;

}catch(error){

console.log("Notification error:",error);

return [];

}

}

/* =========================
ESCAPE
========================= */

function escapeHTML(value){

const div =
document.createElement("div");

div.textContent =
String(value ?? "");

return div.innerHTML;

}

/* =========================
NOTIFICATION TEXT
========================= */

function getNotificationInfo(notification){

const name =
escapeHTML(
notification.name || "Umuntu"
);

if(notification.type === "like"){

return {
icon:"❤️",
text:
"<strong>"+
name+
"</strong> yakunze post yawe."
};

}

if(notification.type === "comment"){

return {
icon:"💬",
text:
"<strong>"+
name+
"</strong> yatanze comment kuri post yawe."
};

}

return {
icon:"🔔",
text:
escapeHTML(
notification.text ||
"Notification nshasha"
)
};

}

/* =========================
LOAD
========================= */

function loadNotifications(){

const list =
document.getElementById(
"notificationList"
);

const count =
document.getElementById(
"unreadCount"
);

if(!list || !count){
return;
}

const user =
getUser();

if(!user){

list.innerHTML =
`

<div class="card error">  
❌ User ntiyabonetse.  
<br><br>  
Subira kuri login.  
</div>  
`;  return;

}

const username =
String(user.username || "")
.trim();

const all =
getNotifications();

/*
TURONKA NOTIFICATIONS
Z'UYU USER GUSA.
*/

const mine =
all.filter(function(notification){

return String(
notification.toUsername || ""
).trim() === username;

});

/*
UNREAD
*/

const unread =
mine.filter(function(notification){

return notification.read !== true;

}).length;

count.textContent =
unread +
" notifications nshasha";

/*
NTA NOTIFICATION
*/

if(mine.length === 0){

list.innerHTML =
`

<div class="card empty">  
🔔 Nta notification uraronka.  
</div>  
`;  return;

}

/*
SORT BY TIME / ID
*/

mine.sort(function(a,b){

return Number(b.id || 0) -
Number(a.id || 0);

});

/*
DISPLAY
*/

list.innerHTML =
mine.map(function(notification){

const info =
getNotificationInfo(
notification
);

const id =
escapeHTML(
String(notification.id || "")
);

const readClass =
notification.read === true
?
""
:
"unread";

return `

<div  
class="notification ${readClass}"  
data-id="${id}"  
>  <div class="notification-main">  <div class="icon">  
${info.icon}  
</div>  <div>  <div class="notification-text">  
${info.text}  
</div>  <div class="notification-time">  
${escapeHTML(  
notification.time || ""  
)}  
</div>  </div>  </div>  </div>  
`;  }).join("");

/*
CLICK EVENTS
*/

const items =
list.querySelectorAll(
".notification"
);

items.forEach(function(item){

item.addEventListener(
"click",
function(){

const id =
item.getAttribute(
"data-id"
);

readNotification(id);

}
);

});

}

/* =========================
READ ONE
========================= */

function readNotification(id){

const user =
getUser();

if(!user){
return;
}

const username =
String(user.username || "")
.trim();

const notifications =
getNotifications();

let changed = false;

notifications.forEach(function(notification){

if(
String(notification.id) === String(id) &&
String(
notification.toUsername || ""
).trim() === username
){

notification.read = true;

changed = true;

}

});

if(changed){

localStorage.setItem(
"deppNetNotifications",
JSON.stringify(notifications)
);

}

loadNotifications();

}

/* =========================
READ ALL
========================= */

function markAllRead(){

const user =
getUser();

if(!user){
return;
}

const username =
String(user.username || "")
.trim();

const notifications =
getNotifications();

let changed = false;

notifications.forEach(function(notification){

if(
String(
notification.toUsername || ""
).trim() === username &&
notification.read !== true
){

notification.read = true;

changed = true;

}

});

if(changed){

localStorage.setItem(
"deppNetNotifications",
JSON.stringify(notifications)
);

}

loadNotifications();

}

/* =========================
CLEAR
========================= */

function clearNotifications(){

const user =
getUser();

if(!user){
return;
}

const username =
String(user.username || "")
.trim();

if(
!confirm(
"Urashaka gusiba notifications zawe zose?"
)
){

return;

}

const notifications =
getNotifications();

const remaining =
notifications.filter(function(notification){

return String(
notification.toUsername || ""
).trim() !== username;

});

localStorage.setItem(
"deppNetNotifications",
JSON.stringify(remaining)
);

loadNotifications();

}

/* =========================
START
========================= */

if(checkLogin()){

const user =
getUser();

if(user){

loadNotifications();

}else{

window.location.href =
"login.html";

}

}

</script></body>

</html>
