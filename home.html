<!DOCTYPE html>
<html lang="rn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Depp Net - Home</title>
<style>
*{box-sizing:border-box;font-family:Arial}
body{margin:0;background:#f2f4f7;padding-bottom:70px}
header{height:60px;background:#1877f2;color:white;display:flex;align-items:center;padding:8px;gap:8px}
.logo{font-size:21px;font-weight:bold;flex:1}
.hbtn{border:0;border-radius:50%;width:42px;height:42px;font-size:20px}
.menuBtn{background:none;color:white;font-size:27px}
.menu{display:none;position:absolute;right:8px;top:58px;background:white;width:210px;z-index:20;border-radius:10px;box-shadow:0 3px 12px #999}
.menu.show{display:block}
.menu button{width:100%;padding:13px;border:0;background:white;text-align:left}
.box{max-width:650px;margin:auto;padding:14px}
.card,.post{background:white;border-radius:12px;padding:14px;margin-bottom:14px;box-shadow:0 2px 7px #ddd}
.profile{display:flex;align-items:center;gap:10px}
.profile img{width:58px;height:58px;border-radius:50%;object-fit:cover;background:#e8f0fe}
.default{width:58px;height:58px;border-radius:50%;background:#e8f0fe;display:flex;align-items:center;justify-content:center;font-size:30px}
.pname{font-weight:bold;font-size:18px}
.puser,.time{color:#777;font-size:12px}
textarea{width:100%;height:80px;padding:10px;border:1px solid #ddd;border-radius:9px;resize:none}
.row{display:flex;gap:7px;margin-top:8px}
.row button,.action,.send{flex:1;border:0;padding:10px;border-radius:8px}
.photo{background:#e8f0fe}.video{background:#e8f8ee}
.main{width:100%;margin-top:8px;background:#1877f2;color:white;border:0;padding:12px;border-radius:8px}
.media img,.media video,.post img,.post video{width:100%;max-height:430px;object-fit:cover;border-radius:9px;margin-top:8px}
.actions{display:flex;gap:7px;margin-top:8px}
.action{background:#f1f3f5}
.comment{display:flex;gap:6px;margin-top:8px}
.comment input{flex:1;padding:10px;border:1px solid #ddd;border-radius:8px}
.send{background:#1877f2;color:white}
.one{background:#f1f3f5;padding:8px;border-radius:8px;margin-top:5px}
.bottom{position:fixed;bottom:0;left:0;right:0;background:white;display:flex;gap:6px;padding:8px;z-index:10;box-shadow:0 -2px 8px #ccc}
.bottom button{flex:1;border:0;padding:10px;border-radius:8px}
.badge{color:red;font-weight:bold}

/* STATUS */
.statusCard{padding:12px;overflow:hidden}
.statusHead{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.statusTitle{font-size:18px;font-weight:bold}
.addStatus{background:#1877f2;color:white;border:0;border-radius:20px;padding:8px 13px}
.statusScroll{display:flex;gap:12px;overflow-x:auto;padding:3px 2px 8px}
.statusItem{min-width:78px;text-align:center;cursor:pointer}
.statusCircle{width:68px;height:68px;border-radius:50%;padding:3px;border:3px solid #1877f2;margin:auto;background:white}
.statusCircle img{width:100%;height:100%;border-radius:50%;object-fit:cover}
.statusDefault{width:100%;height:100%;border-radius:50%;background:#e8f0fe;display:flex;align-items:center;justify-content:center;font-size:28px}
.statusName{font-size:12px;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.statusEmpty{color:#777;font-size:13px;padding:8px}
</style>
</head>

<body>

<header>
<button class="hbtn" onclick="openProfile()">👤</button>
<div class="logo">Depp Net</div>
<button class="hbtn" onclick="openSearch()">🔎</button>
<button class="menuBtn" onclick="toggleMenu()">☰</button>

<div id="menu" class="menu">
<button onclick="openChat()">💬 Chat</button>
<button onclick="openNotifications()">🔔 Notifications <span id="badge"></span></button>
<button onclick="openContacts()">📇 Contacts</button>
<button onclick="logout()">🚪 Logout</button>
</div>
</header>

<div class="box">

<div class="card profile" onclick="openProfile()">
<div id="photoBox"></div>
<div>
<div id="pname" class="pname">User</div>
<div id="puser" class="puser">@user</div>
</div>
</div>

<!-- STATUS -->
<div class="card statusCard">
<div class="statusHead">
<div class="statusTitle">🟢 Status</div>
<button class="addStatus" onclick="openStatus()">➕ Add</button>
</div>
<div id="statusList" class="statusScroll"></div>
</div>

<div class="card">
<h3 id="welcome">Murakaza neza kuri Depp Net 👋</h3>

<textarea id="text" placeholder="Ni igiki ushaka gusangiza abandi?"></textarea>

<div class="row">
<button class="photo" onclick="photoInput.click()">📷 Photo</button>
<button class="video" onclick="videoInput.click()">🎥 Video</button>
</div>

<input id="photoInput" type="file" accept="image/*" hidden>
<input id="videoInput" type="file" accept="video/*" hidden>

<div id="media" class="media"></div>

<button class="main" onclick="post()">📤 Sangiza</button>
</div>

<div id="posts"></div>
</div>

<div class="bottom">
<button onclick="openChat()">💬 Chat</button>
<button onclick="openNotifications()">🔔 <span id="bottomBadge"></span></button>
<button onclick="openContacts()">📇 Contacts</button>
</div>

<script>

if(localStorage.getItem("deppNetLoggedIn")!=="true")
location.href="login.html";

function getUser(){
try{return JSON.parse(localStorage.getItem("deppNetUser")||"null")}
catch(e){return null}
}

let me=getUser();

if(!me)location.href="login.html";

function openProfile(){location.href="profile.html"}
function openSearch(){location.href="search.html"}
function openChat(){location.href="chat.html"}
function openNotifications(){location.href="notify.html"}
function openContacts(){location.href="contacts.html"}
function openStatus(){location.href="status.html"}

function toggleMenu(){
menu.classList.toggle("show");
}

function logout(){
localStorage.removeItem("deppNetLoggedIn");
location.href="login.html";
}

/* PROFILE */

function loadProfile(){

me=getUser();
if(!me)return;

pname.textContent=me.name||"User";
puser.textContent="@"+(me.username||"user");
welcome.textContent="Murakaza neza, "+(me.name||"User")+" 👋";

if(me.photo)
photoBox.innerHTML=`<img src="${me.photo}">`;
else
photoBox.innerHTML=`<div class="default">👤</div>`;
}

/* STATUS */

function getStatuses(){
try{
let x=JSON.parse(localStorage.getItem("deppNetStatuses")||"[]");
return Array.isArray(x)?x:[];
}catch(e){return []}
}

function loadStatuses(){

let now=Date.now();

let a=getStatuses().filter(x=>
now-x.created<24*60*60*1000
);

localStorage.setItem("deppNetStatuses",JSON.stringify(a));

if(!a.length){
statusList.innerHTML=
`<div class="statusEmpty">Nta Status irashirwako ubu. Kanda ➕ Add.</div>`;
return;
}

statusList.innerHTML=a.map(x=>{

let photo=x.photo;

return `
<div class="statusItem" onclick="openStatus()">
<div class="statusCircle">
${photo
?`<img src="${photo}">`
:`<div class="statusDefault">👤</div>`}
</div>
<div class="statusName">${esc(x.name||"User")}</div>
</div>
`;

}).join("");
}

/* MEDIA */

let pic=null,vid=null;

photoInput.onchange=function(){

let f=this.files[0];
if(!f)return;

if(f.size>5*1024*1024){
alert("Photo ni nini cane. Hitamwo iri munsi ya 5MB.");
this.value="";
return;
}

let r=new FileReader();

r.onload=e=>{
pic=e.target.result;
vid=null;
videoInput.value="";
media.innerHTML=`<img src="${pic}">`;
};

r.readAsDataURL(f);
};

videoInput.onchange=function(){

let f=this.files[0];
if(!f)return;

if(f.size>20*1024*1024){
alert("Video ni nini cane. Hitamwo iri munsi ya 20MB.");
this.value="";
return;
}

let r=new FileReader();

r.onload=e=>{
vid=e.target.result;
pic=null;
photoInput.value="";
media.innerHTML=`<video src="${vid}" controls playsinline></video>`;
};

r.readAsDataURL(f);
};

/* POSTS */

function getPosts(){
try{return JSON.parse(localStorage.getItem("deppNetPosts")||"[]")}
catch(e){return []}
}

function post(){

let t=text.value.trim();

if(!t&&!pic&&!vid){
alert("Andika ikintu canke uhitemwo Photo/Video.");
return;
}

let p={
id:Date.now()+"_"+Math.random().toString(36).slice(2),
name:me.name||"User",
username:me.username||"user",
text:t,
photo:pic,
video:vid,
time:new Date().toLocaleString()
};

let a=getPosts();

a.unshift(p);

localStorage.setItem("deppNetPosts",JSON.stringify(a));

text.value="";
pic=null;
vid=null;
photoInput.value="";
videoInput.value="";
media.innerHTML="";

loadPosts();
}

/* LIKES */

function getLikes(){
try{return JSON.parse(localStorage.getItem("deppNetLikes")||"{}")}
catch(e){return {}}
}

function likePost(id){

let a=getLikes();

if(!a[id])a[id]={count:0,users:[]};

let u=String(me.username||"user");

let i=a[id].users.indexOf(u);

if(i<0){
a[id].users.push(u);
a[id].count++;
addNotification(id,"like");
}else{
a[id].users.splice(i,1);
a[id].count--;
}

localStorage.setItem("deppNetLikes",JSON.stringify(a));

loadPosts();
loadBadge();
}

/* COMMENTS */

function getComments(){
try{return JSON.parse(localStorage.getItem("deppNetPostComments")||"{}")}
catch(e){return {}}
}

function comment(id){

let input=document.getElementById("c"+id);

if(!input)return;

let t=input.value.trim();

if(!t)return;

let a=getComments();

if(!a[id])a[id]=[];

a[id].push({
name:me.name||"User",
username:me.username||"user",
text:t,
time:new Date().toLocaleString()
});

localStorage.setItem(
"deppNetPostComments",
JSON.stringify(a)
);

addNotification(id,"comment");

input.value="";

loadPosts();
loadBadge();
}

/* NOTIFICATIONS */

function getNotifications(){
try{return JSON.parse(localStorage.getItem("deppNetNotifications")||"[]")}
catch(e){return []}
}

function addNotification(postId,type){

let a=getPosts();

let p=a.find(x=>x.id===postId);

if(!p)return;

if(String(p.username).toLowerCase()===
String(me.username).toLowerCase())
return;

let n=getNotifications();

n.unshift({
id:Date.now()+"_"+Math.random(),
toUsername:p.username,
fromUsername:me.username,
fromName:me.name||"User",
postId:postId,
type:type,
text:type==="like"
?"akunze post yawe ❤️"
:"yakoze comment kuri post yawe 💬",
read:false,
time:new Date().toLocaleString()
});

localStorage.setItem(
"deppNetNotifications",
JSON.stringify(n)
);
}

function loadBadge(){

let u=String(me.username||"").toLowerCase();

let n=getNotifications().filter(x=>
String(x.toUsername||"").toLowerCase()===u &&
x.read!==true
);

badge.textContent=n.length?n.length:"";
bottomBadge.textContent=n.length?n.length:"";
}

/* POSTS DISPLAY */

function esc(x){

let d=document.createElement("div");

d.textContent=x||"";

return d.innerHTML;
}

function loadPosts(){

let a=getPosts();
let l=getLikes();
let c=getComments();

if(!a.length){

posts.innerHTML=
`<div class="post">
<b>Depp Net</b>
<p>Murakaza neza 🚀</p>
</div>`;

return;
}

posts.innerHTML=a.map(p=>{

let z=l[p.id]||{count:0,users:[]};
let cs=c[p.id]||[];

let liked=z.users.includes(
String(me.username||"")
);

let comments=cs.map(x=>
`<div class="one">
<b>${esc(x.name)}</b><br>
${esc(x.text)}<br>
<small>${esc(x.time)}</small>
</div>`
).join("");

return `
<div class="post">

<b>${esc(p.name)}</b>

<div class="time">
@${esc(p.username)} · ${esc(p.time)}
</div>

${p.text?`<div>${esc(p.text)}</div>`:""}

${p.photo?`<img src="${p.photo}">`:""}

${p.video?
`<video src="${p.video}" controls playsinline></video>`
:""}

<div class="actions">

<button class="action"
onclick="likePost('${p.id}')">

${liked?"❤️ Liked":"👍 Like"} ${z.count||0}

</button>

</div>

<div class="comment">

<input
id="c${p.id}"
placeholder="Andika comment...">

<button
class="send"
onclick="comment('${p.id}')">
Send
</button>

</div>

${comments}

</div>
`;

}).join("");
}

/* START */

loadProfile();
loadStatuses();
loadPosts();
loadBadge();

</script>

</body>
</html>
